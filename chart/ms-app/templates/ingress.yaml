apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-{{ .Release.Name }}-{{ .Values.global.env }}
  namespace: {{ .Release.Namespace }}
  {{ if .Values.global.labels }}
  labels:
  {{ toYaml .Values.global.labels | indent 2 }}
  {{ end }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.rules.host }}
      http:
        paths:
          - pathType: Prefix
            path: {{ .Values.ingress.rules.path }}
            backend:
              service:
                name: service-{{ .Release.Name }}-{{ .Values.global.env }}
                port:
                  number: 80