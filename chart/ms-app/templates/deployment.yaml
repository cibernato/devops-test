apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-{{ .Release.Name }}-{{ .Values.global.env }}
  namespace: {{ .Release.Namespace }}
  {{ if .Values.global.labels }}
  labels:
  {{ toYaml .Values.global.labels | indent 2 }}
  {{ end }}
spec:
  replicas: {{ .Values.global.replicas }}
  selector:
    matchLabels:
    {{ toYaml .Values.global.labels | indent 2 }}
  template:
    metadata:
      labels:
      {{ toYaml .Values.global.labels | indent 2 }}
    spec:
      securityContext:
{{ toYaml .Values.app.podSecurityContext | indent 8 }}
      containers:
        - name: {{ .Release.Name }}-{{ .Values.global.env }}
          image: {{ .Values.app.repository }}:{{ .Values.app.tag }}
          securityContext:
{{ toYaml .Values.app.containerSecurityContext | indent 12 }}
          livenessProbe:
{{ toYaml .Values.app.livenessProbe | indent 12 }}
          readinessProbe:
{{ toYaml .Values.app.readinessProbe | indent 12 }}
          resources:
{{ toYaml .Values.app.resources | indent 12 }}
          ports:
          {{- range $key, $value := index .Values.app.ports }}
            - name: {{ $value.name }}
              containerPort: {{ $value.containerPort}}
          {{- end }}
          env:
          {{- range $key, $value := index .Values.variables.configmap }}
            - name: {{ $value.name }}
              valueFrom:
                configMapKeyRef:
                  name: configmap-{{ $.Release.Name }}-{{ $.Values.global.env }}
                  key: {{ $value.name }}
          {{- end }}
          {{- range $key, $value := index .Values.variables.secret }}
            - name: {{ $value.name }}
              valueFrom:
                secretKeyRef:
                  name: secret-{{ $.Release.Name }}-{{ $.Values.global.env }}
                  key: {{ $value.name }}
          {{- end }}