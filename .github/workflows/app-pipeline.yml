name: App Pipeline

on:
  push:
    branches:
      - 'feature/*'
      - 'master'
    paths-ignore:
      - 'terraform/**'
      - '.github/workflows/iac-pipeline.yml'

env:
  IMAGE_STAGE_BUILD_TEST: jersonf/maven:3.8.6_java17
  CACHE_PATH: ~/.m2/repository
  CONTAINER_REGISTRY: jersonf
  DOCKER_IMAGE_NAME: devsu-java

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: jersonf/maven:3.8.6_java17
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Maven Install
        run: mvn install -Dmaven.test.skip=true -Dmaven.repo.local=${{ env.CACHE_PATH }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavaArtifact
          path: target/

  test:
    name: Unit Test
    needs: build
    runs-on: ubuntu-latest
    container:
      image: jersonf/maven:3.8.6_java17
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Maven Test
        run: mvn clean verify -Dmaven.repo.local=${{ env.CACHE_PATH }} -Dspring.profiles.active=test

  sonarcloud:
    name: SonarCloud Analysis
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: jersonf/maven:3.8.6_java17
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache Maven Packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_PATH }}
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify -Dspring.profiles.active=test sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECTKEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.branch.name=${{ github.ref_name }}

      - name: SonarCloud Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECTKEY: ${{ secrets.SONAR_PROJECTKEY }}
        run: |
          echo "Checking SonarCloud Quality Gate"
          curl -s -u ${{ secrets.SONAR_TOKEN }}: "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECTKEY }}" \
          | jq -r '.projectStatus.status' > status.txt
          STATUS=$(cat status.txt)
          echo "Quality Gate Status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "Quality Gate Failed!"
            exit 1
          fi

  docker:
    name: Containerization
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Docker Image Tag
        id: tag
        run: |
          TAG=$(date +'%Y_%m_%d-%H_%M_%S')
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}

      - name: Save Tag Artifact
        run: |
          mkdir -p files
          echo "${{ steps.tag.outputs.TAG }}" > files/tag.txt

      - name: Upload Tag Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageTag
          path: files/tag.txt

  security:
    name: Snyk Scan
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Tag Artifact
        uses: actions/download-artifact@v4
        with:
          name: ImageTag
          path: artifact

      - name: Get Image Tag
        id: get_tag
        run: |
          TAG=$(cat artifact/tag.txt)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ steps.get_tag.outputs.TAG }}
          args: --severity-threshold=critical --exclude-app-vulns

  deploy:
    name: Deploy App to EKS
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Tag Artifact
        uses: actions/download-artifact@v4
        with:
          name: ImageTag
          path: artifact

      - name: Get Image Tag
        id: get_tag
        run: |
          TAG=$(cat artifact/tag.txt)
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name eks-devsu --region us-east-1

      - name: Set Environment
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      - name: Deploy with Helm
        run: |
          helm install java-microservice ./chart/ms-app/ \
            --set global.env=${{ env.ENV }} \
            --set app.repository=${{ env.CONTAINER_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }} \
            --set app.tag=${{ steps.get_tag.outputs.TAG }} \
            --namespace ${{ env.ENV }} --create-namespace
